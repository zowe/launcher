name: Build and Test Workflow

permissions:
  id-token: write
  issues: write
  pull-requests: write
  contents: write
on:
  push:
    branches:
      - v3.x/master
      - v3.x/staging
      - v3.x/rc
  pull_request:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      PERFORM_RELEASE:
        description: '[Release] perform release'
        required: false
        default: 'false'

jobs:
  check-permission:
    runs-on: ubuntu-latest
    steps:
      # this action will fail the whole workflow if permission check fails
      - name: check permission
        uses: zowe-actions/shared-actions/permission-check@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  check_changelog:
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-changelog')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          # Robot commits trigger checks for the new PR head.
          token: ${{ github.event.pull_request.head.repo.full_name == github.repository && secrets.ZOWE_ROBOT_TOKEN || github.token }}

      - name: Create and check changelog fragments
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_DESCRIPTION: ${{ github.event.pull_request.body }}
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          HAS_ROBOT_TOKEN: ${{ secrets.ZOWE_ROBOT_TOKEN != '' }}
        run: |
          fragment=".changelog/CHANGELOG.${PR_NUMBER}"
          if [ ! -e "$fragment" ]; then
            if [ "$IS_FORK" = "true" ] || [ "$HAS_ROBOT_TOKEN" != "true" ]; then
              echo "Automatic fragment commits require a branch in this repository and ZOWE_ROBOT_TOKEN. Add $fragment manually."
              exit 1
            fi
            node .github/workflows/set-changelog.js "$PR_NUMBER"
            git add -- "$fragment"
          fi

          node .changelog/merge.js --check "$PR_NUMBER"
          base=$(git merge-base "$BASE_SHA" HEAD)
          if [ -z "$(git diff --name-only --diff-filter=AM "$base" -- "$fragment")" ]; then
            echo "Add or update $fragment with the changes made in this pull request. See .changelog/README.md."
            exit 1
          fi

          if ! git diff --cached --quiet -- "$fragment"; then
            git config user.email "zowe-robot@users.noreply.github.com"
            git config user.name "Zowe Robot"
            git commit -s -m "Add changelog fragment for PR #${PR_NUMBER}" -- "$fragment"
            git push origin "HEAD:refs/heads/${HEAD_REF}"
          fi

  check-messages:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./build
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Test changelog scripts
        working-directory: .
        run: node --test test/other/changelog.test.js test/other/set-changelog.test.js

      - name: Check defined and documented ZWEL messages
        run: |
          result=$(node ./buildZwelMessages.js --check)
          if [ "${result}" != "0" ]; then
            echo "${result}"
            exit 1
          fi

  build-test:
    runs-on: ubuntu-latest
    needs: [ check-permission, check-messages ]
    steps:
      - name: '[Prep 1] Checkout'
        uses: actions/checkout@v3

      - name: '[Dep 1] Libyaml'
        uses: actions/checkout@v3
        with:
          repository: yaml/libyaml
          path: deps/launcher/libyaml
          ref: '0.2.5'

      - name: '[Dep 2] Quickjs'
        uses: actions/checkout@v3
        with:
          repository: zowe/quickjs-portable
          path: deps/launcher/quickjs
          ref: 'staging'

      - name: '[Dep 3] Zowe common'
        uses: actions/checkout@v3
        with:
          repository: zowe/zowe-common-c
          path: deps/launcher/common
          ref: 'v3.x/staging'

      - name: '[Prep 2] Setup jFrog CLI'
        uses: jfrog/setup-jfrog-cli@v5
        env:
          JF_ENV_1: ${{ secrets.JF_ARTIFACTORY_TOKEN }}

      - name: 'convert manifest'
        run: |
          COMMIT_HASH=$(git rev-parse --verify HEAD)
          CURRENT_TIME=$(date +%s%3N)
          if [ -z ${{ github.event.pull_request.number }} ]
          then
            CURRENT_BRANCH=${GITHUB_REF#refs/heads/}
          else
            CURRENT_BRANCH=PR-${{ github.event.pull_request.number }}
          fi
          sed -e "s|{{build\.branch}}|${CURRENT_BRANCH}|g" \
              -e "s|{{build\.number}}|${{ github.run_number }}|g" \
              -e "s|{{build\.commitHash}}|${COMMIT_HASH}|g" \
              -e "s|{{build\.timestamp}}|${CURRENT_TIME}|g" \
              manifest.yaml > manifest.yaml.tmp
          mv manifest.yaml.tmp manifest.yaml

          echo "Current manifest.yaml is:"
          cat manifest.yaml

      - name: '[Prep 3] Prepare workflow'
        uses: zowe-actions/shared-actions/prepare-workflow@main

      - name: '[Packaging] Make pax'
        uses: zowe-actions/shared-actions/make-pax@main
        with:
          pax-name: 'launcher'
          pax-options: '-x os390'
          pax-ssh-username: ${{ secrets.SSH_MARIST_USERNAME }}
          pax-ssh-password: ${{ secrets.SSH_MARIST_RACF_PASSWORD }}

      - name: '[Publish] Publish'
        uses: zowe-actions/shared-actions/publish@main
        if: success()
        with:
          artifacts: |
            .pax/launcher.pax
          perform-release: ${{ github.event.inputs.PERFORM_RELEASE }}

      - name: '[Release 1] Release (if necessary)'
        if: ${{ success() && github.event.inputs.PERFORM_RELEASE == 'true' && env.IS_RELEASE_BRANCH == 'true' }}
        uses: zowe-actions/shared-actions/release@main

      - name: '[Release 2] NPM bump version (if necessary)'
        if: ${{ success() && github.event.inputs.PERFORM_RELEASE == 'true' && env.IS_RELEASE_BRANCH == 'true' }}
        uses: zowe-actions/shared-actions/bump-version@main
        with:
          version: minor
        env:
          GITHUB_TOKEN: ${{ secrets.ZOWE_ROBOT_TOKEN }}
