name: Build and Test Workflow

# Default for jobs without their own block, every job below requests only what it needs
permissions:
  contents: read
on:
  push:
    branches:
      - v3.x/master
      - v3.x/staging
      - v3.x/rc
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      PERFORM_RELEASE:
        description: '[Release] perform release'
        required: false
        default: 'false'

jobs:
  check-permission:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # this action will fail the whole workflow if permission check fails
      - name: check permission
        uses: zowe-actions/shared-actions/permission-check@77d7d9b50e60fedc8132b5e5eb6d611c4e483416 # main (2026-06-15)
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  update-changelog:
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-changelog')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # pushes the generated CHANGELOG.md commit to the PR branch
    outputs:
      was_updated: ${{ steps.check-change.outputs.change_detected }}
      check_commit: ${{ steps.check-changelog.outputs.check_commit }}
    steps:
      - name: Checkout code
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Check for updated CHANGELOG.md using git
        id: check-changelog
        run: |
          if git diff --name-only origin/${{ github.base_ref }} | grep -q "^CHANGELOG.md$"; then
            echo "CHANGELOG.md has been updated."
            echo "::set-output name=check_commit::true"
          else
            echo "ERROR: CHANGELOG.md has not been updated."
            echo "::set-output name=check_commit::false"
          fi
      - name: Compare PR description with template
        if: steps.check-changelog.outputs.check_commit == 'false'
        env:
          PR_DESCRIPTION: ${{ github.event.pull_request.body }}
        run: |
          # Safely print the PR description using Node.js

          node -e "const fs=require('fs'); fs.writeFileSync('/tmp/pr_description.txt', process.env.PR_DESCRIPTION);"
          # Use diff to compare the two files
          if diff -wB /tmp/pr_description.txt .github/pull_request_template.md > /dev/null; then
            echo "ERROR: PR description is identical to the template."
            exit 1
          else
            echo "PR description and template are different."
          fi

      - name: Check PR body against changelog
        if: steps.check-changelog.outputs.check_commit == 'false'
        id: extract-changelog
        run: |
          result=$(node .github/workflows/set-changelog.js ${{ github.event.pull_request.number }})
          if [ "$result" = "Success" ]; then
            git config --global user.email "zowe-robot@users.noreply.github.com"
            git config --global user.name "Zowe Robot"
            git add CHANGELOG.md
            git commit -s -m "Update changelog with PR #${{ github.event.pull_request.number }} description"
            git push
            echo "Updated CHANGELOG from description"
          else
            echo $result
            echo -e "No changelog and version information found in PR description. Please add them.\nExpected Format:\nVERSION:X.XX.X\nCHANGELOG:This is changelog note.\nTo re-run the action, just make a push or commit after updating the PR description or updating the changelog via a manual file changing commit."
            exit 1
          fi

      - name: check for changes
        id: check-change
        run: |
          if git diff --name-only HEAD^ HEAD | grep 'changelog.md'; then
            echo "No Changes detected, setting flag to false"
            echo "::set-output name=change_detected::false"
          else
            echo "::set-output name=change_detected::true"
            fi

  check_changelog:
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-changelog')
    needs: update-changelog
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0

      - name: Verify Changelog update
        run: |
          if [ "${{ needs.update-changelog.outputs.was_updated }}" != "true" ]; then
            echo "CHANGELOG.md not updated, please update CHANGELOG.md with the changes made in the pull request"
            exit 1
          else
            echo "changelog was updated successfully."
          fi

  check-messages:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./build
    steps:
      - name: Checkout code
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0

      - name: Check defined and documented ZWEL messages
        run: |
          result=$(node ./buildZwelMessages.js --check)
          if [ "${result}" != "0" ]; then
            echo "${result}"
            exit 1
          fi

  build-test:
    runs-on: ubuntu-latest
    needs: [ check-permission, check-messages ]
    permissions:
      contents: read
      pull-requests: read  # prepare-workflow looks up the open PR for the current branch
    steps:
      - name: '[Prep 1] Checkout'
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0

      - name: '[Dep 0] Read pinned dependency commits'
        id: deps
        run: |
          . build/launcher.proj.env
          for dep in LIBYAML QUICKJS COMMON; do
            eval commit="\$${dep}_COMMIT"
            if ! echo "${commit}" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::${dep}_COMMIT in build/launcher.proj.env must be a full commit SHA, found '${commit}'"
              exit 1
            fi
            echo "${dep}=${commit}" >> "$GITHUB_OUTPUT"
          done

      - name: '[Dep 1] Libyaml'
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
        with:
          repository: yaml/libyaml
          path: deps/launcher/libyaml
          ref: ${{ steps.deps.outputs.LIBYAML }}

      - name: '[Dep 2] Quickjs'
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
        with:
          repository: zowe/quickjs-portable
          path: deps/launcher/quickjs
          ref: ${{ steps.deps.outputs.QUICKJS }}

      - name: '[Dep 3] Zowe common'
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
        with:
          repository: zowe/zowe-common-c
          path: deps/launcher/common
          ref: ${{ steps.deps.outputs.COMMON }}

      - name: '[Prep 2] Setup jFrog CLI'
        uses: jfrog/setup-jfrog-cli@6ed45ef1a24199bd4c94d3fd55a7e8cb7e45985d # v5.3.2
        env:
          JF_ENV_1: ${{ secrets.JF_ARTIFACTORY_TOKEN }}

      - name: 'convert manifest'
        run: |
          COMMIT_HASH=$(git rev-parse --verify HEAD)
          CURRENT_TIME=$(date +%s%3N)
          if [ -z ${{ github.event.pull_request.number }} ]
          then
            CURRENT_BRANCH=${GITHUB_REF#refs/heads/}
          else
            CURRENT_BRANCH=PR-${{ github.event.pull_request.number }}
          fi
          sed -e "s|{{build\.branch}}|${CURRENT_BRANCH}|g" \
              -e "s|{{build\.number}}|${{ github.run_number }}|g" \
              -e "s|{{build\.commitHash}}|${COMMIT_HASH}|g" \
              -e "s|{{build\.timestamp}}|${CURRENT_TIME}|g" \
              manifest.yaml > manifest.yaml.tmp
          mv manifest.yaml.tmp manifest.yaml

          echo "Current manifest.yaml is:"
          cat manifest.yaml

      - name: '[Prep 3] Prepare workflow'
        uses: zowe-actions/shared-actions/prepare-workflow@77d7d9b50e60fedc8132b5e5eb6d611c4e483416 # main (2026-06-15)

      - name: '[Packaging] Make pax'
        uses: zowe-actions/shared-actions/make-pax@77d7d9b50e60fedc8132b5e5eb6d611c4e483416 # main (2026-06-15)
        with:
          pax-name: 'launcher'
          pax-options: '-x os390'
          pax-ssh-username: ${{ secrets.SSH_MARIST_USERNAME }}
          pax-ssh-password: ${{ secrets.SSH_MARIST_RACF_PASSWORD }}

      - name: '[Publish] Publish'
        uses: zowe-actions/shared-actions/publish@77d7d9b50e60fedc8132b5e5eb6d611c4e483416 # main (2026-06-15)
        if: success()
        with:
          artifacts: |
            .pax/launcher.pax
          perform-release: ${{ github.event.inputs.PERFORM_RELEASE }}

  # The only job with write access, it runs solely for a manual dispatch with PERFORM_RELEASE
  release:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.PERFORM_RELEASE == 'true'
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: write      # release pushes the version tag with the checkout credentials
      pull-requests: read  # prepare-workflow looks up the open PR for the current branch
    env:
      # Same value the publish step exports in build-test, as it is not given a pre-release-string
      PRE_RELEASE_STRING: ''
    steps:
      - name: '[Prep 1] Checkout'
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0

      - name: '[Prep 2] Prepare workflow'
        uses: zowe-actions/shared-actions/prepare-workflow@77d7d9b50e60fedc8132b5e5eb6d611c4e483416 # main (2026-06-15)

      - name: '[Release 1] Release (if necessary)'
        if: env.IS_RELEASE_BRANCH == 'true'
        uses: zowe-actions/shared-actions/release@77d7d9b50e60fedc8132b5e5eb6d611c4e483416 # main (2026-06-15)

      - name: '[Release 2] NPM bump version (if necessary)'
        if: env.IS_RELEASE_BRANCH == 'true'
        uses: zowe-actions/shared-actions/bump-version@77d7d9b50e60fedc8132b5e5eb6d611c4e483416 # main (2026-06-15)
        with:
          version: minor
        env:
          GITHUB_TOKEN: ${{ secrets.ZOWE_ROBOT_TOKEN }}
